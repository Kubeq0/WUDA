services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wuda_db
      POSTGRES_USER: wuda_user
      POSTGRES_PASSWORD: wuda_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn mysite.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=production_secret_key_123
      - ALLOWED_HOSTS=*
      - POSTGRES_DB=wuda_db
      - POSTGRES_USER=wuda_user
      - POSTGRES_PASSWORD=wuda_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: